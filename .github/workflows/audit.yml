# Weekly RustSec advisory check over Cargo.lock. Separate from ci.yml on purpose:
# it needs no toolchain, no MinGW and no 3 GB of model assets, so it costs seconds.
# Runs on a schedule, on lockfile changes, and on demand.
name: audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  push:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the action opens an issue for a new advisory on a scheduled run

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
