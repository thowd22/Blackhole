[package]
name = "blackhole"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com_StructuredStorage",
] }
windows-core = "0.61"
rusqlite = { version = "0.32", features = ["bundled"] }
pdf-extract = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "5"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "directml", "api-20"] }
tokenizers = { version = "0.23", default-features = false, features = ["unstable_wasm"] }
anyhow = "1"

[profile.release]
# Inference kernels (candle, tract) need real optimisation; size is dominated by the models anyway.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
